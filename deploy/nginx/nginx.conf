user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;

    # WebSocket connection upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Geo mapping: identify local private subnet vs external WAN
    geo $is_local_net {
        default        0;
        127.0.0.0/8    1;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
        169.254.0.0/16 1; # Link-local
        ::1            1;
        fc00::/7       1; # IPv6 Unique Local
        fe80::/10      1; # IPv6 Link-local
    }

    # Gzip Compression
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # HTTP Server (Port 80)
    # - Local subnet ($is_local_net = 1): Served directly over HTTP without SSL warnings
    # - External WAN ($is_local_net = 0): Redirected to HTTPS (Port 443)
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        client_max_body_size 1024M;
        client_body_buffer_size 128k;

        # Redirect external WAN requests to HTTPS
        if ($is_local_net = 0) {
            return 301 https://$host$request_uri;
        }

        # Internal qBittorrent Web UI Proxy (Local subnet)
        location /qbittorrent/ {
            proxy_pass http://127.0.0.1:8085/;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Host 127.0.0.1:8085;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cookie_path / /qbittorrent/;
        }

        # Main Web Application & API Proxy (Local subnet)
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;

            # WebSocket Support (/api/system/stream live telemetry & /api/terminal/ws bash PTY)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Low-latency streaming (disable buffering for WebSocket and system stats)
            proxy_buffering off;
            proxy_request_buffering off;

            # Long timeouts for persistent WebSockets (Live charts and interactive terminal)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 60s;
        }
    }

    # HTTPS Server (Port 443)
    # - External WAN ($is_local_net = 0): Served with TLS/SSL
    # - Local subnet ($is_local_net = 1): Redirected to HTTP (Port 80) to avoid self-signed SSL warnings
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # Self-Signed / Custom SSL Certificates
        ssl_certificate     /etc/nginx/certs/gamecube.crt;
        ssl_certificate_key /etc/nginx/certs/gamecube.key;

        # TLS Protocols and Strong Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Allow large file uploads (Torrent files, ROMs, Game backups)
        client_max_body_size 1024M;
        client_body_buffer_size 128k;

        # Redirect local clients to HTTP to avoid self-signed certificate warnings
        if ($is_local_net = 1) {
            return 301 http://$host$request_uri;
        }

        # Internal qBittorrent Web UI Proxy
        location /qbittorrent/ {
            proxy_pass http://127.0.0.1:8085/;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Host 127.0.0.1:8085;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cookie_path / /qbittorrent/;
        }

        # Main Web Application & API Proxy
        location / {
            # In a Podman Pod, all containers share the network namespace (127.0.0.1)
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;

            # WebSocket Support (/api/system/stream live telemetry & /api/terminal/ws bash PTY)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Low-latency streaming (disable buffering for WebSocket and system stats)
            proxy_buffering off;
            proxy_request_buffering off;

            # Long timeouts for persistent WebSockets (Live charts and interactive terminal)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 60s;
        }
    }
}
