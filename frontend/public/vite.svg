<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="gamecubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a9fff" />
      <stop offset="100%" stop-color="#00d8d8" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1a9fff" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="32" fill="url(#gamecubeGrad)" filter="url(#glow)" />

  <!-- Gamepad2 Controller Icon -->
  <g transform="translate(24, 30) scale(1.6)" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Gamepad Outer Body -->
    <path d="M6 11H3.5C2.67 11 2 11.67 2 12.5v12.9a2.5 2.5 0 0 0 4.25 1.77L10.5 23h27l4.25 4.17A2.5 2.5 0 0 0 46 25.4V12.5c0-.83-.67-1.5-1.5-1.5H42" />
    <path d="M18 11V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5" />
    <path d="M6 11a4 4 0 0 1 4-4h28a4 4 0 0 1 4 4" />
    
    <!-- D-Pad on Left -->
    <line x1="12" y1="16" x2="12" y2="20" stroke-width="2.5" />
    <line x1="10" y1="18" x2="14" y2="18" stroke-width="2.5" />
    
    <!-- Action Buttons on Right -->
    <circle cx="34" cy="16" r="1.2" fill="#ffffff" stroke="none" />
    <circle cx="38" cy="18" r="1.2" fill="#ffffff" stroke="none" />
    <circle cx="34" cy="20" r="1.2" fill="#ffffff" stroke="none" />
    <circle cx="30" cy="18" r="1.2" fill="#ffffff" stroke="none" />
  </g>
</svg>
